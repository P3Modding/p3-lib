[package]
name = "p3-rou"
edition = "2021"

[[bin]]
name = "roucli"
path = "src/cli.rs"

[dependencies]
bitvec = "1"
byteorder = "1.5.0"
clap = { workspace = true }
log = "0.4"
num-traits = { workspace = true }
p3-api = { path = "../p3-api" }
serde = { version = "1.0", features = ["derive"] }
simple_logger = "4.1"
toml = "0.7"
