# `sell_price` is the minimum sell price used by supply routes, `buy_price` is the
# maximum buy price used by the suck route type. `supply` is the quantity (in-game
# units) required to supply `citizens` inhabitants; goods without a `supply` entry are
# not part of citizens' supply. Supply quantities scale linearly with the citizens
# parameter, rounded up; prices are used as-is.
